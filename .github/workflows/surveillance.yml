# Surveillance du site, toutes les heures (gratuit : le dépôt est public).
# Si une vérification échoue, l'exécution échoue et GitHub envoie un e-mail
# à la personne qui a modifié ce fichier en dernier (réglage des
# notifications : github.com/settings/notifications, rubrique Actions).
name: Surveillance du site

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pages principales et sous-domaines
        run: |
          set -u
          echec=0
          verifier() { # adresse, code attendu, texte attendu (facultatif)
            # deux essais de 90 s : une application en veille (hébergement gratuit) met parfois une minute à se réveiller
            for essai in 1 2; do
              code=$(curl -s -o page.html -w "%{http_code}" --max-time 90 "$1?surveillance=$(date +%s)" || true)
              [ "$code" = "$2" ] && break
              sleep 20
            done
            if [ "$code" != "$2" ]; then echo "::error::$1 répond $code (attendu $2)"; echec=1; return; fi
            if [ -n "${3:-}" ] && ! grep -q "$3" page.html; then echo "::error::$1 ne contient plus « $3 »"; echec=1; return; fi
            echo "OK  $1 ($code)"
          }
          verifier https://uborardc.com/ 200 "entreprise"
          verifier https://uborardc.com/contact 200 "contactForm"
          verifier https://uborardc.com/confidentialite 200 "Confidentialité"
          verifier https://uborardc.com/une-page-qui-n-existe-pas 404
          verifier https://avec.uborardc.com/ 200 "AVEC"
          verifier https://ong.uborardc.com/ 301              # redirige vers uborardc.org (le site de l'ONG a changé d'adresse)
          verifier https://uborardc.org/ 200 "UBORA"
          verifier https://bp.uborardc.com/ 200
          verifier https://akiba.uborardc.com/ 200
          verifier https://hub.uborardc.com/ 200
          verifier https://academie.uborardc.com/ 200
          verifier https://asbl.uborardc.com/ 200
          exit $echec

      - name: En-têtes de sécurité
        run: |
          h=$(curl -sI --max-time 30 https://uborardc.com/ | tr -d '\r')
          for e in "strict-transport-security" "content-security-policy" "x-frame-options: DENY" "x-content-type-options: nosniff"; do
            echo "$h" | grep -qi "^$e" || { echo "::error::en-tête manquant : $e"; exit 1; }
          done
          echo "OK  en-têtes de sécurité"

      - name: Base de données joignable
        run: |
          # depuis le 22/11/2026, la clé de la base reste dans le Worker : on lit le contenu publié par la route publique /api/contenu
          # (le Worker interroge la base ; une lecture qui échoue y vaut null, une base joignable donne des listes, même vides)
          code=$(curl -s -o contenu.json -w "%{http_code}" --max-time 30 "https://uborardc.com/api/contenu?surveillance=$(date +%s)" || true)
          [ "$code" = "200" ] || { echo "::error::la base (via /api/contenu) répond $code"; exit 1; }
          node -e 'const d = JSON.parse(require("fs").readFileSync("contenu.json", "utf8")); const ko = Object.keys(d).filter(k => !Array.isArray(d[k])); if (!Object.keys(d).length || ko.length) { console.log("::error::lecture de la base en échec pour : " + (ko.join(", ") || "tout")); process.exit(1); }'
          echo "OK  base ($code)"

      - name: Certificats (alerte 14 jours avant l'expiration)
        run: |
          for d in uborardc.com avec.uborardc.com akiba.uborardc.com hub.uborardc.com academie.uborardc.com asbl.uborardc.com; do
            fin=$(echo | timeout 30 openssl s_client -servername "$d" -connect "$d:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2 || true)
            [ -n "$fin" ] || { echo "::error::certificat de $d illisible"; exit 1; }
            reste=$(( ( $(date -d "$fin" +%s) - $(date +%s) ) / 86400 ))
            [ "$reste" -ge 14 ] || { echo "::error::certificat de $d : $reste jours restants"; exit 1; }
            echo "OK  $d : certificat valable encore $reste jours"
          done
