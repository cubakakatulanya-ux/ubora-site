<body>
<a class="skip" href="#app">Aller au contenu</a>
<div class="progress-top" id="readBar"></div>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="/" aria-label="Ubora, retour à l'accueil">
      <img class="logo-img" src="/logo-ubora.png" alt="" width="50" height="50">
      <span class="brand-txt"><span class="brand-name">Ub<b>o</b>ra</span><span class="brand-sub">Entreprise sociale</span></span>
    </a>
    <nav class="site-nav" aria-label="Menu principal"><ul class="menu" id="menu">{{MENU}}</ul></nav>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Thème sombre" aria-pressed="false">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn btn-ghost btn-sm btn-soutenir" href="/soutenir">Soutenir nos actions</a>
      <a class="btn btn-accent btn-sm" href="/contact" aria-label="Nous contacter">Contact</a>
      <button class="icon-btn burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <div class="ticker">
    <span class="ticker-label"><i></i><span>À la une</span></span>
    <div class="ticker-track"><div class="ticker-move" id="tickerMove">{{TICKER}}</div></div>
  </div>
</header>

<main id="app" tabindex="-1" data-pre="{{CANON}}">{{APP}}</main>

<footer class="site-footer" id="footer">{{FOOTER}}</footer>

<a class="wa-float" id="waFloat" href="https://wa.me/243998275144" target="_blank" rel="noopener" aria-label="Écrire à Ubora sur WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
</a>
<button class="to-top" id="toTop" type="button" aria-label="Revenir en haut de la page">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
